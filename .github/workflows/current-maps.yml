name: current-maps-mac-safari
on:
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: sudo safaridriver --enable
      - name: Live maps desktop Safari, no free text
        run: |
          rm -rf results
          mkdir -p results
          set -o pipefail
          node cv-current-maps.mjs 2>&1 | tee results/current-mac.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-maps-mac-safari
          path: results/
          retention-days: 7
