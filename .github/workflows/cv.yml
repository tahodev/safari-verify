name: cv-matrix
on:
  push:
    paths: ["cv-matrix.mjs","cv.html",".github/workflows/cv.yml"]
jobs:
  v:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo safaridriver --enable
      - run: (python3 -m http.server 8099 >/dev/null 2>&1 &); sleep 2; mkdir -p results; node cv-matrix.mjs 2>&1 | tee results/cv.log
      - name: iOS Simulator Safari canvas
        if: always()
        run: |
          mkdir -p results
          xcrun simctl list devices available | grep -i iphone | head -5
          UD=$(xcrun simctl list devices available | grep -i "iPhone" | grep -v unavail | head -1 | grep -o '[0-9A-F]\{8\}-[0-9A-F-]\{27\}')
          echo "UDID=$UD"
          xcrun simctl boot $UD || true
          xcrun simctl bootstatus $UD -b || true
          xcrun simctl openurl $UD http://localhost:8099/cv.html
          sleep 15
          xcrun simctl io $UD screenshot results/cv-ios-sim.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cv-results, path: results/, retention-days: 7}
