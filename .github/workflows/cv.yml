name: cv-matrix
on:
  push:
    paths: ["cv-matrix.mjs","cv.html"]
jobs:
  v:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo safaridriver --enable
      - run: (python3 -m http.server 8099 >/dev/null 2>&1 &); sleep 2; mkdir -p results; node cv-matrix.mjs 2>&1 | tee results/cv.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: cv-results, path: results/, retention-days: 7}
