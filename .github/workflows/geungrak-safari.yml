name: geungrak real Mac Safari check
on:
  push:
    paths:
      - '.github/workflows/geungrak-safari.yml'
      - 'geungrak-check.mjs'
  workflow_dispatch:
jobs:
  safari:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: enable safaridriver
        run: sudo safaridriver --enable
      - name: run geungrak on real Safari
        run: |
          mkdir -p results
          ONLY=geungrak timeout 600 node safari-check.mjs || true
      - uses: actions/upload-artifact@v4
        with:
          name: geungrak-safari-results
          path: results/
