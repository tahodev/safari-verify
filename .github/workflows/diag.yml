name: diag-tap
# Narrow read-only diagnostics: seongsu-dogam + ghibli-travel tap paths,
# sajumadang entry + market pin, gazua-beopdang photo-card stack capture.
# Scoped: safari.yml ignores every path this workflow lives on. diag-tap legs run
# only when diag-tap.mjs itself changes (or on manual dispatch) to avoid reruns.
on:
  push:
    paths: [".github/workflows/diag.yml", "diag-tap.mjs", "cv-diag-saju.mjs", "cv-diag-photo.mjs"]
  workflow_dispatch: {}

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wake Render services
        run: |
          curl -s -o /dev/null -w "seongsu %{http_code}\n" "https://seongsu-dogam-4qf0.onrender.com/"
          curl -s -o /dev/null -w "ghibli %{http_code}\n" "https://ghibli-travel.onrender.com/"
          curl -s -o /dev/null -w "saju %{http_code}\n" "https://sajumadang.onrender.com/"
          curl -s -o /dev/null -w "gazua %{http_code}\n" "https://gazua-beopdang.onrender.com/"
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      - name: Desktop tap diagnostics
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, 'diag-tap.mjs') || contains(github.event.head_commit.added, 'diag-tap.mjs')
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p results
          ONLY="seongsu-dogam,ghibli-travel" node diag-tap.mjs 2>&1 | tee results/diag-desktop.log
      - name: Gazua photo-card stack capture (first, independent - cannot be starved)
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p results
          node cv-diag-photo.mjs 2>&1 | tee results/diag-photo-desktop.log
      - name: Saju entry + market pin diagnostics (locale-agnostic, independent)
        if: always()
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p results
          node cv-diag-saju.mjs 2>&1 | tee results/diag-saju-desktop.log
      - name: Upload desktop results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-desktop
          path: results/
          retention-days: 7
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, 'diag-tap.mjs') || contains(github.event.head_commit.added, 'diag-tap.mjs')
    steps:
      - uses: actions/checkout@v4
      - name: Wake Render services
        run: |
          curl -s -o /dev/null -w "seongsu %{http_code}\n" "https://seongsu-dogam-4qf0.onrender.com/"
          curl -s -o /dev/null -w "ghibli %{http_code}\n" "https://ghibli-travel.onrender.com/"
      - name: iOS Simulator tap diagnostics (positive control)
        run: |
          set -o pipefail
          mkdir -p results
          ONLY="seongsu-dogam,ghibli-travel" bash cv-diag-ios.sh 2>&1 | tee results/ios.log
      - name: Upload iOS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-ios
          path: results/
          retention-days: 7
