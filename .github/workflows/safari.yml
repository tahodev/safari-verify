name: safari-verify
on:
  push:
    paths-ignore: ["nd-*","cv*",".github/workflows/nd-npc.yml",".github/workflows/cv.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: 'comma-separated app name filter (e.g. seongsu-dogam)'
        required: false
        default: ''
      skip_ios:
        description: 'skip the iOS Simulator leg'
        required: false
        type: boolean
        default: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Wake Render free-tier services
        run: |
          for u in golden-gate-picnic-e9r0 sweet-factory-escape-3d coworking-world seongsu-dogam-4qf0 dalbit-saju-clone kurashi-otaru gazua-beopdang ghibli-travel; do
            curl -s -o /dev/null -w "$u %{http_code}\n" "https://$u.onrender.com/" &
          done
          wait
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      - name: Canvas sanity probe (Safari environment)
        run: |
          set -o pipefail
          mkdir -p results
          (python3 -m http.server 8099 >/dev/null 2>&1 &) ; sleep 2
          cat > /tmp/canvas-probe.mjs <<'MJS'
          import { spawn } from 'node:child_process';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const driver=spawn('/usr/bin/safaridriver',['-p','4445'],{stdio:'ignore'});
          await sleep(2500);
          const B='http://127.0.0.1:4445';
          async function wd(m,p,b){const r=await fetch(B+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()}
          try{
            const s=await wd('POST','/session',{capabilities:{alwaysMatch:{browserName:'safari'}}});
            const sid=s.value.sessionId;
            await wd('POST',`/session/${sid}/url`,{url:'http://localhost:8099/probe.html'});
            let out='';
            for(let i=0;i<30;i++){await sleep(1000);const t=await wd('POST',`/session/${sid}/execute/sync`,{script:'return document.title',args:[]});if(t.value==='DONE'){const o=await wd('POST',`/session/${sid}/execute/sync`,{script:'return document.getElementById("out").textContent',args:[]});out=o.value;break}}
            console.log('CANVAS-PROBE:',out||'(timed out)');
            const png=await wd('GET',`/session/${sid}/screenshot`);
            if(png.value){const{writeFileSync}=await import('node:fs');writeFileSync('results/canvas-probe.png',Buffer.from(png.value,'base64'))}
            await wd('DELETE',`/session/${sid}`);
          }catch(e){console.log('CANVAS-PROBE error',String(e))}
          driver.kill();
          MJS
          node /tmp/canvas-probe.mjs 2>&1 | tee results/canvas-probe.log
      - name: Desktop Safari verification
        run: |
          set -o pipefail
          mkdir -p results
          ONLY="${{ inputs.only }}" node safari-check.mjs 2>&1 | tee results/desktop.log
      - name: iOS Simulator Mobile Safari verification
        if: always() && !inputs.skip_ios
        run: |
          set -o pipefail
          mkdir -p results
          ONLY="${{ inputs.only }}" bash ios-check.sh 2>&1 | tee results/ios.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-results
          path: results/
          retention-days: 7
