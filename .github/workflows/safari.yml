name: safari-verify
on:
  push:
  workflow_dispatch:
    inputs:
      only:
        description: 'comma-separated app name filter (e.g. seongsu-dogam)'
        required: false
        default: ''
      skip_ios:
        description: 'skip the iOS Simulator leg'
        required: false
        type: boolean
        default: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Wake Render free-tier services
        run: |
          for u in golden-gate-picnic sweet-factory-escape-3d coworking-world seongsu-dogam dalbit-saju-clone kurashi-otaru; do
            curl -s -o /dev/null -w "$u %{http_code}\n" "https://$u.onrender.com/" &
          done
          wait
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      - name: Desktop Safari verification
        run: |
          set -o pipefail
          mkdir -p results
          ONLY="${{ inputs.only }}" node safari-check.mjs 2>&1 | tee results/desktop.log
      - name: iOS Simulator Mobile Safari verification
        if: always() && !inputs.skip_ios
        run: |
          set -o pipefail
          mkdir -p results
          bash ios-check.sh 2>&1 | tee results/ios.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-results
          path: results/
          retention-days: 7
